# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: dynamic-workflows-insurance-policy-review
metadata:
  template: dynamic-workflows-insurance-policy-review@0.1.0
services:
  api:
    project: ./src
    language: python
    host: function
hooks:
  postprovision:
    windows:
      shell: pwsh
      run: ./infra/scripts/authorize-outlook.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: ./infra/scripts/authorize-outlook.sh
      interactive: true
      continueOnError: false
  postdeploy:
    windows:
      shell: pwsh
      run: ./infra/scripts/configure-outlook-trigger.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: ./infra/scripts/configure-outlook-trigger.sh
      interactive: true
      continueOnError: false
